[project]
name = "voice-agent"
version = "0.1.0"
description = "Minimal voice-conversation pipeline: ASR -> LLM -> TTS, with barge-in"
requires-python = ">=3.10"
dependencies = [
    "sounddevice",
    "numpy",
    "webrtcvad",
    "setuptools<81", # webrtcvad imports pkg_resources, removed in newer setuptools
    "python-dotenv",
    "groq",
    "openai",
    "livekit-agents",
    "livekit-plugins-elevenlabs",
]

[project.scripts]
voice-agent = "voice_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]
